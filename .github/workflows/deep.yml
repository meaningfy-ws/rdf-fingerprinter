name: deep

# The slow gate: every test including the Hypothesis property tests, with the coverage floors
# (`make check-all-deep`). Weekly and on demand; the per-PR gate is the quick `make check-all` (ci.yml).
on:
  schedule:
    - cron: '0 3 * * 1'  # Mondays 03:00 UTC
  workflow_dispatch:

jobs:
  check-all-deep:
    name: check-all-deep (3.14)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Set up Node.js (openspec validate)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Poetry
        run: pipx install "poetry>=2.0.0,<3.0.0"
      - name: Install dependencies
        run: |
          poetry env use python
          poetry check --lock
          make install
      - name: Deep gate (Hypothesis, coverage floors)
        run: make check-all-deep
