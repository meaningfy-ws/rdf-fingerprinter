[pytest]
# No-src layout: make the top-level packages importable from the repo root.
pythonpath = .
testpaths = tests
# Gherkin features (P-8); step definitions live in tests/bdd/.
bdd_features_base_dir = tests/features
# Coverage flags live only in the Makefile `test` target, so plain `pytest` stays fast.
addopts =
    -r a
    -v
    --strict-markers

# Use-case tags on the Gherkin scenarios (docs/modules/ROOT/pages/use-cases/), as pytest markers.
markers =
    uc_w1: UC-W1 Fingerprint an endpoint
    uc_b1_1: UC-B1.1 Fingerprint from the command line
    uc_b1_2: UC-B1.2 Fingerprint from an embedding application
    uc_w2: UC-W2 Publish a fingerprint as an application profile
    uc_b2_1: UC-B2.1 Generate representations from a saved profile
    uc_b2_2: UC-B2.2 Generate representations while fingerprinting
    manual: checked by hand in a browser once per change (readable-representations, design Verification map); skipped

junit_family = xunit2
# rdflib (FakeSparql's store) calls its own deprecated Dataset API internally.
filterwarnings =
    ignore::DeprecationWarning:rdflib.*
