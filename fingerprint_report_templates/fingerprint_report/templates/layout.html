<!doctype html>
{#- The report page frame: inline CSS and script only, no external request (readable-representations DEC-4).
    Autoescape is on: every value comes from an endpoint. -#}
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="generator" content="rdf-fingerprinter">
<title>{% block title %}{{ conf.title }}{% endblock %}</title>
<style>
:root {
  --paper: #f6f7f5; --panel: #ffffff; --ink: #1d2422; --muted: #5c6764; --rule: #d8ddda; --accent: #1f6b73;
  --chip-l: 36%; --chip-s: 52%;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root { --paper: #141a19; --panel: #1b2321; --ink: #e3e9e6; --muted: #98a4a0; --rule: #2d3734; --accent: #74c4cc;
          --chip-l: 72%; --chip-s: 48%; }
}
* { box-sizing: border-box; }
html { scroll-padding-top: 4.5rem; }
body { margin: 0; background: var(--paper); color: var(--ink);
       font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.bar { position: sticky; top: 0; z-index: 2; display: flex; flex-wrap: wrap; gap: .5rem 1.25rem; align-items: center;
       padding: .7rem 1rem; background: var(--panel); border-bottom: 1px solid var(--rule); }
.bar h1 { margin: 0; font-size: 1.05rem; font-weight: 650; }
.bar h1 small { font-weight: 400; color: var(--muted); }
.bar input[type=search] { flex: 1 1 14rem; max-width: 26rem; padding: .4rem .6rem; font: inherit; color: inherit;
       background: var(--paper); border: 1px solid var(--rule); border-radius: 6px; }
.count { color: var(--muted); font-variant-numeric: tabular-nums; }
.frame { display: grid; grid-template-columns: 17rem minmax(0, 1fr); gap: 0 2rem; max-width: 92rem; margin: 0 auto; padding: 0 1rem; }
nav { position: sticky; top: 3.6rem; align-self: start; max-height: calc(100vh - 3.6rem); overflow: auto; padding: 1rem 0 2rem;
      font-size: .9rem; }
nav ul { list-style: none; margin: 0; padding: 0 0 0 .75rem; }
nav li { margin: .1rem 0; overflow-wrap: anywhere; }
nav summary { cursor: pointer; font-weight: 600; margin-top: .6rem; }
nav .group { color: var(--muted); margin-top: .35rem; }
nav .ind { color: var(--muted); font-size: .78rem; white-space: nowrap; font-variant-numeric: tabular-nums; }
nav fieldset { border: 0; padding: 0; margin: 1.25rem 0 0; }
nav legend { font-weight: 600; padding: 0; margin-bottom: .3rem; }
nav label { display: flex; gap: .4rem; align-items: center; }
main { padding: 1rem 0 4rem; min-width: 0; }
h2 { font-size: 1.3rem; margin: 2.2rem 0 .6rem; padding-bottom: .3rem; border-bottom: 1px solid var(--rule); }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(11rem, 1fr)); gap: .75rem; margin: 0; }
.facts div { background: var(--panel); border: 1px solid var(--rule); border-radius: 8px; padding: .6rem .8rem; }
.facts dt { color: var(--muted); font-size: .85rem; }
.facts dd { margin: 0; font-size: 1.15rem; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.pfx { color: hsl(var(--h, 190) var(--chip-s) var(--chip-l)); font-weight: 600; }
.curie { overflow-wrap: anywhere; }
details.cls { background: var(--panel); border: 1px solid var(--rule); border-left: 4px solid hsl(var(--h, 190) var(--chip-s) var(--chip-l));
              border-radius: 6px; margin: .7rem 0; }
details.cls > summary { cursor: pointer; padding: .6rem .9rem; display: flex; flex-wrap: wrap; gap: .25rem 1rem; align-items: baseline; }
details.cls > summary h3 { margin: 0; font-size: 1.02rem; }
.meta { color: var(--muted); font-size: .88rem; }
.scroll { overflow-x: auto; padding: 0 .9rem .8rem; }
table { border-collapse: collapse; width: 100%; font-size: .86rem; }
th, td { text-align: left; padding: .3rem .5rem; border-bottom: 1px solid var(--rule); vertical-align: top; }
th { font-weight: 600; color: var(--muted); white-space: nowrap; }
td.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.plain { background: var(--panel); border: 1px solid var(--rule); border-radius: 6px; }
.note { color: var(--muted); }
.badge { display: inline-block; padding: 0 .45rem; border-radius: 999px; font-size: .8rem; font-weight: 600;
         color: #fff; background: var(--muted); text-decoration: none; }
.badge.critical { background: #b42318; } .badge.important { background: #b54708; } .badge.minor { background: #475467; }
tr.group th { background: var(--paper); color: var(--ink); text-align: left; padding-top: .5rem; }
ul.tree { list-style: none; margin: .2rem 0; padding-left: 1.1rem; }
ul.tree > li { margin: .15rem 0; }
ul.tree summary { cursor: pointer; }
.pop { display: inline-block; width: 6rem; height: .55rem; background: var(--rule); border-radius: 3px; vertical-align: middle; }
.pop .bar { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
details.pitfall { background: var(--panel); border: 1px solid var(--rule); border-radius: 6px; margin: .5rem 0; }
details.pitfall > summary { cursor: pointer; padding: .5rem .9rem; display: flex; flex-wrap: wrap; gap: .25rem .75rem; align-items: baseline; }
[hidden] { display: none !important; }
@media (max-width: 760px) {
  .frame { grid-template-columns: minmax(0, 1fr); }
  nav { position: static; max-height: none; border-bottom: 1px solid var(--rule); }
  html { scroll-padding-top: 7rem; }
}
@media (prefers-reduced-motion: no-preference) { details.cls[open] > .scroll { animation: open .15s ease-out; } }
@keyframes open { from { opacity: 0; } to { opacity: 1; } }
{% block style %}{% endblock %}
</style>
</head>
<body>
{% block content %}{% endblock %}
{% block script %}{% endblock %}
</body>
</html>
