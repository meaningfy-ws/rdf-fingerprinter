[mypy]
# Non-strict baseline; eds4jinja2 ships no type stubs.
python_version = 3.12
ignore_missing_imports = True
check_untyped_defs = False
warn_unused_configs = True
explicit_package_bases = True
pretty = True

[mypy-fingerprint.domain.profile]
# slot_usage narrows list ranges in subclasses (list[GraphProfile] → list[GraphAnalytics]);
# mypy flags that as invariance. The rest of the generated module is checked.
disable_error_code = assignment
