# Builds the site from this checkout (CI and local); published to GitHub Pages by docs.yml.
site:
  title: RDF Fingerprinter Documentation
  url: https://meaningfy-ws.github.io/rdf-fingerprinter
  start_page: rdf-fingerprinter::index.adoc

content:
  sources:
    - url: ./..
      start_path: docs
      branches: [HEAD]
      edit_url: false

ui:
  bundle:
    url: https://gitlab.com/antora/antora-ui-default/-/jobs/artifacts/HEAD/raw/build/ui-bundle.zip?job=bundle-stable
    snapshot: true

asciidoc:
  attributes:
    idprefix: ''
    idseparator: '-'
    page-pagination: ''

antora:
  extensions:
    - require: '@antora/lunr-extension'
      snippet_length: 250
    # Renders [mermaid] blocks in the browser with mermaid.js; no diagram text leaves the page.
    - require: '@sntke/antora-mermaid-extension'
      mermaid_library_url: https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs
