id: https://data.meaningfy.ws/fingerprint/views/schema
name: fingerprint_views
title: Fingerprint representation views
description: |
  What each representation template receives: the SHACL shapes, the PlantUML diagram and the
  profile document of a fingerprint, with every value already written for its format by the
  generators in fingerprint/service_layer/generators. Custom templates rely on these names
  (domain-object-model DEC-2, P-3).
  Source of fingerprint/domain/views.py (make generate-models).
version: 0.1.0
license: Apache-2.0
prefixes:
  linkml: https://w3id.org/linkml/
  fp: https://data.meaningfy.ws/fingerprint/
default_prefix: fp
default_range: string
imports:
  - linkml:types

enums:
  RepresentationFormat:
    description: A representation a fingerprint can be published as; the name the commands and --format use.
    permissible_values:
      shacl: { description: "SHACL shapes, one Turtle file per graph." }
      puml: { description: "PlantUML class diagrams: per graph an overview and one file per module." }
      doc: { description: "The report page main.html (HTML), from a saved profile." }
      pitfalls: { description: "The pitfall findings as ROBOT-style TSV, one file per scanned graph (pitfall-scans)." }
      pattern: { description: "The pattern schema: one text file per graph." }
      shex: { description: "Enriched ShEx compact: one .shex file per graph." }
  ShapeSeverity:
    description: The severity of a property shape; violation is SHACL's default and is not written.
    permissible_values:
      info: {}
      warning: {}
      violation: {}
  OutputCheck:
    description: The check a generated text must pass before any file of its format is written.
    permissible_values:
      turtle: { description: "The text parses as Turtle." }
  TargetKind:
    description: What the values of a pattern edge are.
    permissible_values:
      group: {}
      datatype: {}
      iri: {}
      blank_node: {}
      unknown: {}
  DiagramMemberKind:
    description: How a property appears in a diagram class.
    permissible_values:
      attribute: { description: "A line inside the class box." }
      association: { description: "An arrow to the class of its values." }
  DiagramKind:
    description: Which diagram a PlantUML file holds; the one template branches on it.
    permissible_values:
      overview: { description: "The namespaces of a graph and the links between them." }
      module: { description: "The classes of one namespace, or of one cluster of it." }

classes:
  # --- shared ---
  PrefixDeclaration:
    description: A prefix and its namespace IRI.
    attributes:
      prefix: { required: true }
      namespace: { required: true }
      source: { description: "Where the prefix came from (user, packaged, prefix_cc, generated); set in the report's table." }
      uses: { range: integer, description: "Instances of the namespace's classes plus subjects of its properties, over every class and graph; set in the report's table (pitfall-scans DEC-18)." }

  Annotation:
    description: A predicate and its value, both written as Turtle.
    attributes:
      predicate: { required: true }
      value: { required: true }

  RenderedDocument:
    description: A rendered text and the file name it is written under.
    attributes:
      file_name: { required: true }
      text: { required: true }

  GraphView:
    mixin: true
    description: What every per-graph view carries.
    attributes:
      graph_label: { required: true, description: "The graph's plain name, for the title." }
      slug: { required: true, description: "The graph's file-safe name." }
      skipped: { multivalued: true, description: "IRIs left out because they cannot be written." }

  GeneratorOptions:
    description: Options of the generators beyond the shared ones.
    attributes:
      shapes_namespace: { description: "One namespace for every shape IRI (SHACL only); unset: per class namespace." }
      exclude_namespaces: { multivalued: true, description: "Prefixes or namespace IRIs whose classes are left out, beyond the meta vocabularies." }
      include_namespaces: { multivalued: true, description: "Prefixes or namespace IRIs shown again; wins over exclusion." }
      module_size: { range: integer, minimum_value: 1, ifabsent: "int(15)", description: "Most classes per diagram module (PlantUML only)." }
      ontology: { description: "Path of an ontology file whose labels and descriptions override the profile's (pattern and ShEx outputs)." }
      min_instances: { range: integer, minimum_value: 1, description: "Classes with fewer instances are left out (pattern and ShEx outputs)." }
      max_classes: { range: integer, minimum_value: 1, description: "Most classes shown, the largest first (pattern and ShEx outputs)." }

  # --- SHACL ---
  ShapesGraph:
    description: The shapes of one graph.
    mixins: [GraphView]
    attributes:
      prefixes: { range: PrefixDeclaration, multivalued: true, inlined_as_list: true }
      node_shapes: { range: NodeShape, multivalued: true, inlined_as_list: true }

  NodeShape:
    description: The open node shape of one class.
    attributes:
      shape: { required: true, description: "The shape IRI, as Turtle." }
      target: { required: true, description: "The target class, as Turtle." }
      annotations: { range: Annotation, multivalued: true, inlined_as_list: true }
      property_shapes: { range: PropertyShape, multivalued: true, inlined_as_list: true }

  PropertyShape:
    description: The shape of one property of one class.
    attributes:
      shape: { required: true, description: "The property shape IRI, as Turtle." }
      path: { required: true, description: "The property, as Turtle." }
      constraints: { multivalued: true, description: "Constraint lines, as Turtle." }
      severity: { range: ShapeSeverity, required: true }
      annotations: { range: Annotation, multivalued: true, inlined_as_list: true }

  # --- PlantUML ---
  DiagramModule:
    description: The class diagram of one module of a graph.
    mixins: [GraphView]
    attributes:
      kind: { range: DiagramKind, required: true }
      name: { required: true, description: "The module's name: a prefix, with ~n for a cluster." }
      classes: { range: DiagramClass, multivalued: true, inlined_as_list: true }
      reference_boxes: { range: DiagramBox, multivalued: true, inlined_as_list: true, description: "Classes outside the module that its arrows point to." }

  DiagramOverview:
    description: The namespaces of one graph and the links between them.
    mixins: [GraphView]
    attributes:
      kind: { range: DiagramKind, required: true }
      packages: { range: DiagramPackage, multivalued: true, inlined_as_list: true }
      links: { range: DiagramLink, multivalued: true, inlined_as_list: true }

  DiagramPackage:
    description: A namespace in the overview.
    attributes:
      alias: { required: true }
      prefix: { required: true }
      classes: { range: integer, required: true, description: "Shown classes of the namespace; 0 when only referenced." }
      referenced: { range: boolean, required: true, description: "True when the namespace holds only link targets." }
      modules: { multivalued: true, description: "The module names of the namespace." }

  DiagramLink:
    description: The links from one namespace to another.
    attributes:
      source: { required: true, description: "The source package alias." }
      target: { required: true, description: "The target package alias." }
      count: { range: integer, required: true }

  DiagramClass:
    description: One class box.
    attributes:
      alias: { required: true }
      label: { required: true }
      members: { range: DiagramMember, multivalued: true, inlined_as_list: true }
      generalisations: { multivalued: true, description: "Generalisation lines, as PlantUML." }

  DiagramMember:
    description: An attribute line, or the target of an association (multiplicity, class alias and label).
    attributes:
      kind: { range: DiagramMemberKind, required: true }
      text: { required: true }

  DiagramBox:
    description: A box for a parent class.
    attributes:
      alias: { required: true }
      label: { required: true }

  # --- pattern schema ---
  EdgeTarget:
    description: What the values of an edge are.
    attributes:
      kind: { range: TargetKind, required: true }
      name: { required: true, description: "As written." }
      classes: { range: uriorcurie, multivalued: true, description: "For a group." }
      graph: { range: uriorcurie, description: "The other graph, when the class is profiled there." }
      has_shape: { range: boolean }
      nested: { range: boolean, description: "The group is a nested one (it has no block of its own); whether any edge expands it or not." }

  PatternEdge:
    description: One edge line of a block.
    attributes:
      property: { range: uriorcurie, required: true }
      name: { required: true }
      depth: { range: integer, required: true, minimum_value: 1, maximum_value: 3, description: "1 = the block's own edge, one hop per level." }
      targets: { range: EdgeTarget, multivalued: true, inlined_as_list: true }
      text: { required: true, description: "The line after the indent." }
      stats: { description: "The statistics token text." }
      ending: { description: "Empty, ' ^' or ' …'." }
      min_count: { range: integer }
      max_count: { range: integer }
      presence_only: { range: boolean }
      edges: { range: PatternEdge, multivalued: true, inlined_as_list: true, description: "Nested edges." }

  ViaLink:
    description: A group reached through another group's property.
    attributes:
      source: { required: true, description: "The group name." }
      property: { required: true, description: "The property name." }

  CoTypeNote:
    description: Another type the subjects of a block also have.
    attributes:
      name: { required: true }
      subjects: { range: integer }

  PatternBlock:
    description: The block of one class group.
    attributes:
      name: { required: true }
      classes: { range: uriorcurie, multivalued: true }
      shape: { description: "The ShExC label." }
      instances: { range: integer }
      observed: { range: integer, description: "Only in first_n mode." }
      nested: { range: boolean }
      reaching_edges: { range: integer }
      co_types: { range: CoTypeNote, multivalued: true, inlined_as_list: true }
      via: { range: ViaLink, multivalued: true, inlined_as_list: true }
      header: { description: "As written." }
      edges: { range: PatternEdge, multivalued: true, inlined_as_list: true }

  GlossaryEntry:
    description: A term with its label or description line.
    attributes:
      term: { range: uriorcurie, required: true }
      name: { required: true }
      line: { required: true }

  PatternGraph:
    description: The pattern schema of one graph.
    mixins: [GraphView]
    attributes:
      graph: { range: uriorcurie }
      prefixes: { range: PrefixDeclaration, multivalued: true, inlined_as_list: true }
      hidden_classes: { range: integer }
      blocks: { range: PatternBlock, multivalued: true, inlined_as_list: true }
      nested_blocks: { range: PatternBlock, multivalued: true, inlined_as_list: true, description: "Every nested group's own block, edges from depth 1." }
      glossary: { range: GlossaryEntry, multivalued: true, inlined_as_list: true }

  # --- ShExC ---
  ShexConstraint:
    description: One triple constraint of a shape.
    attributes:
      predicate: { required: true }
      value: { required: true }
      cardinality: {}
      comment: {}
      inline: { range: ShexConstraint, multivalued: true, inlined_as_list: true }
      depth: { range: integer }

  ShexShape:
    description: One shape.
    attributes:
      comment: {}
      label: { required: true }
      blank: { range: boolean }
      constraints: { range: ShexConstraint, multivalued: true, inlined_as_list: true }

  ShexSchema:
    description: The enriched ShExC of one graph.
    mixins: [GraphView]
    attributes:
      prefixes: { range: PrefixDeclaration, multivalued: true, inlined_as_list: true }
      hidden_classes: { range: integer }
      shapes: { range: ShexShape, multivalued: true, inlined_as_list: true }
      glossary: { multivalued: true }
      skipped_terms: { multivalued: true }

  # --- document ---
  ProfileDocument:
    description: The application-profile document.
    attributes:
      overview: { range: Overview, required: true, inlined: true }
      namespaces: { range: PrefixDeclaration, multivalued: true, inlined_as_list: true, description: "The profile's namespace table, with sources and uses: by source, then uses descending, then prefix." }
      collection: { range: CollectionSection, required: true, inlined: true }
      pitfalls: { range: DocumentPitfalls, inlined: true, description: "Present when the profile holds scan results." }
      graphs: { range: DocumentGraph, multivalued: true, inlined_as_list: true }
      caveats: { range: Caveats, required: true, inlined: true }
      skipped: { multivalued: true, description: "IRIs that cannot be written; the same list as caveats.skipped, kept for custom templates." }

  Overview:
    description: How the profile was collected.
    attributes:
      endpoint: {}
      started_at: { range: datetime }
      finished_at: { range: datetime }
      tool_version: {}

  CollectionSection:
    description: How the run went - its settings and failures.
    attributes:
      settings: { range: SettingValue, multivalued: true, inlined_as_list: true }
      failures: { range: FailureNote, multivalued: true, inlined_as_list: true }

  SettingValue:
    description: A collection setting as the document prints it.
    attributes:
      name: { required: true }
      value: { required: true, description: "The value as text; — when unset." }

  DocumentGraph:
    description: The chapter of one graph.
    attributes:
      slug: { required: true }
      label: { required: true, description: "The graph as a short name." }
      iri: { description: "The graph IRI; absent for the default graph." }
      empty: { range: boolean, required: true, description: "True when the graph has no class partitions." }
      classes: { range: DocumentClass, multivalued: true, inlined_as_list: true, description: "Grouped by namespace prefix, then by instances descending, then short name." }
      taxonomy: { range: TaxonomyNode, multivalued: true, inlined_as_list: true, description: "The root nodes of the class tree." }

  TaxonomyNode:
    description: A class in the taxonomy view, with its popularity (pitfall-scans DEC-15).
    attributes:
      label: { required: true }
      iri: { required: true }
      anchor: { description: "The class section's anchor; absent for a parent not profiled in the graph." }
      instances: { range: integer, description: "Absent for a parent not profiled in the graph." }
      bar: { range: integer, required: true, description: "The popularity bar width, 0-100, against the graph's largest class." }
      see: { description: "For a class with several parents: the anchor of its full node, drawn under its first parent." }
      children: { range: TaxonomyNode, multivalued: true, inlined_as_list: true }

  DocumentClass:
    description: The section of one class.
    attributes:
      iri: { required: true }
      label: { required: true }
      prefix: { required: true, description: "The prefix of the class's namespace, for the filters." }
      anchor: { required: true }
      q: { required: true, description: "The search text: short name and IRI, lower case." }
      instances: { range: integer, required: true }
      data_properties: { range: integer, required: true, description: "Shown properties with datatype or mixed values (pitfall-scans DEC-19)." }
      object_properties: { range: integer, required: true, description: "Shown properties with object or mixed values (pitfall-scans DEC-19)." }
      precision: { required: true, description: "exact, or first N of M." }
      sample_note: { description: "(sample may differ between queries), when the sample was not shared." }
      sampled: { range: boolean, required: true }
      parents: { range: ParentReference, multivalued: true, inlined_as_list: true }
      properties: { range: DocumentProperty, multivalued: true, inlined_as_list: true, description: "Own, refined, inherited; each by subjects, confidence, short name." }
      property_groups: { range: DocumentPropertyGroup, multivalued: true, inlined_as_list: true }
      badges: { range: DocumentBadge, multivalued: true, inlined_as_list: true, description: "Pitfall checks whose examples name this class." }

  DocumentPropertyGroup:
    description: The properties a class gets one way - own, refined or inherited (pitfall-scans DEC-14).
    attributes:
      name: { required: true, description: "Own, Refined or Inherited." }
      properties: { range: DocumentProperty, multivalued: true, inlined_as_list: true }

  DocumentBadge:
    description: A link from a class section to a pitfall check entry.
    attributes:
      check_id: { required: true }
      anchor: { required: true }
      importance: { required: true }

  DocumentPitfalls:
    description: The Pitfalls section of the report.
    attributes:
      summary: { range: PitfallLevelCount, multivalued: true, inlined_as_list: true }
      graphs: { range: DocumentPitfallGraph, multivalued: true, inlined_as_list: true }

  PitfallLevelCount:
    description: The number of distinct checks with findings at one importance.
    attributes:
      importance: { required: true }
      checks: { range: integer, required: true }

  DocumentPitfallGraph:
    description: The pitfall results of one graph.
    attributes:
      label: { required: true }
      slug: { required: true }
      checks: { range: DocumentPitfallCheck, multivalued: true, inlined_as_list: true, description: "Checks with findings, ordered by importance, count (descending), id." }
      clean: { multivalued: true, description: "Ids of the checks that found nothing." }

  DocumentPitfallCheck:
    description: One check's entry in the Pitfalls section.
    attributes:
      check_id: { required: true }
      anchor: { required: true }
      title: { required: true }
      description: {}
      importance: { required: true }
      source: { required: true }
      count: { range: integer, required: true }
      heuristic: { range: boolean, required: true }
      q: { required: true, description: "The search text: id and title, lower case." }
      examples: { range: DocumentPitfallExample, multivalued: true, inlined_as_list: true }

  DocumentPitfallExample:
    description: One example row, each term as the page shows it.
    attributes:
      entity: { range: DocumentValue, inlined: true }
      property: { range: DocumentValue, inlined: true }
      value: { range: DocumentValue, inlined: true }

  DocumentValue:
    description: An RDF term as the page shows it - a short name with its IRI, or text.
    attributes:
      label: { required: true }
      iri: { description: "The full IRI, for an IRI term." }

  PitfallsTable:
    description: The TSV of one graph's pitfall examples (ROBOT report columns).
    mixins: [GraphView]
    attributes:
      lines: { range: PitfallLine, multivalued: true, inlined_as_list: true }

  PitfallLine:
    description: One TSV line - every value already written for TSV.
    attributes:
      level: { required: true }
      rule: { required: true }
      subject: { required: true }
      property: { required: true }
      value: { required: true }

  ParentReference:
    description: A parent class as the document names it.
    attributes:
      iri: { required: true }
      label: { required: true }
      source: { required: true, description: "declared or implied." }

  DocumentProperty:
    description: The row of one property; every value is display text (numbers rounded to 2 decimals, — when absent).
    attributes:
      iri: { required: true }
      label: { required: true }
      subjects: { required: true }
      min: { required: true }
      max: { required: true }
      avg: { required: true }
      kind: { required: true }
      distinct: { required: true }
      types: { range: DocumentTerm, multivalued: true, inlined_as_list: true }
      confidence: { required: true }
      cardinality: { required: true, description: "The cardinality label; present for a presence-only property." }
      inheritance: { required: true }
      language_coverage: { required: true }

  DocumentTerm:
    description: An IRI as the page shows it.
    attributes:
      iri: { required: true }
      label: { required: true }

  Caveats:
    description: What the reader should know about how complete the profile is.
    attributes:
      sampled: { range: SampledClass, multivalued: true, inlined_as_list: true }
      untyped: { range: UntypedSubjects, multivalued: true, inlined_as_list: true }
      hidden: { range: HiddenNamespace, multivalued: true, inlined_as_list: true }
      skipped: { multivalued: true }
      unjoined_default: { range: boolean, description: "True when schema graphs were given and the default graph was scanned without them (pitfall-scans DEC-20)." }

  UntypedSubjects:
    description: The subjects without rdf:type in one graph (only when graph statistics were collected).
    attributes:
      graph: { required: true }
      count: { range: integer, required: true }

  HiddenNamespace:
    description: A namespace the filters hid, and how many classes it held.
    attributes:
      prefix: { required: true }
      namespace: { required: true }
      classes: { range: integer, required: true }

  SampledClass:
    attributes:
      graph: { required: true }
      class_label: { required: true }
      precision: { required: true }

  FailureNote:
    attributes:
      graph: { required: true }
      class_label: { required: true }
      property_label: {}
      measurement: { required: true, description: "The query kind that failed." }
      attempts: {}
      message: {}
